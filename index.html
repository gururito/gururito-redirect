<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>ホームページ移転のお知らせ | 株式会社グルリト</title>
  <meta name="description" content="株式会社グルリトのホームページ移転先をご案内します。">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f8; color: #27323c; padding: 24px; }
    main { width: min(100%, 640px); padding: clamp(28px, 6vw, 56px); background: white; border-radius: 12px; box-shadow: 0 8px 32px rgba(35, 45, 55, .06); }
    .company { margin: 0 0 24px; color: #5e6b75; font-size: 14px; letter-spacing: .04em; }
    h1 { margin: 0 0 24px; font-size: clamp(22px, 4vw, 30px); line-height: 1.5; }
    p { margin: 0 0 20px; line-height: 1.95; }
    a { color: #075ea8; overflow-wrap: anywhere; text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid #1479bd; outline-offset: 4px; }
    .destination { margin: 28px 0; padding: 18px 20px; background: #f1f6fa; border-radius: 8px; }
    .destination a { font-weight: 700; }
    .note { color: #54616d; font-size: 14px; }
    footer { margin-top: 40px; font-size: 13px; color: #687580; }
  </style>
</head>
<body>
  <main>
    <p class="company">株式会社グルリト</p>
    <h1>ホームページ移転のお知らせ</h1>
    <p>株式会社グルリトのホームページは、以下のURLへ移転いたしました。</p>
    <div class="destination">
      <a href="https://www.gururito.co.jp/">https://www.gururito.co.jp/</a>
    </div>
    <p class="note">新規サービスのお申し込み受付は終了しております。現在のサービスに関する情報は、移転先のホームページをご確認ください。</p>
    <footer>株式会社グルリト</footer>
  </main>
</body>
</html>
